title: The Sorted Home
tagline: Simple organization ideas for real homes
description: >-
  Storage solutions, small-space tips, and products that actually work —
  simple organization ideas for real homes.
url: "https://thesortedhome.github.io" # confirmed live 2026-07-28, filled in 2026-07-29 (was blank, broke canonical/og:url/sitemap)
baseurl: "/thesortedhome-blog"

theme: minima
minima:
  skin: classic
  social_links:
    pinterest: TheSortedHomeINC

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
